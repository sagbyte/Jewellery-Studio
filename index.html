<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagar’s CAD Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202c;--mute:#667585;--line:#d8dee6;--acc:#1c6a8a;--gold:#b8862f;--bad:#b4475a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 170px}
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:18px 18px 0;background:linear-gradient(135deg,#0d2f45 0%,#1c6a8a 60%,#2b8fa0 100%);box-shadow:0 10px 30px -12px rgba(15,60,90,.55)}
.hero .gem{position:absolute;right:-14px;top:-10px;width:170px;height:170px;opacity:.16;stroke-width:1.1}
.hero .gem2{right:80px;top:70px;width:80px;height:80px;opacity:.12}
.hero h1{margin:0;font:700 2.5rem/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.09em;position:relative}
.hero .nm{font:italic 600 1.7rem 'Cormorant Garamond',serif;color:#f1cf8a;position:relative}
.strip{position:relative;margin:16px -18px 0;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(6,20,32,.38);border-top:1px solid rgba(241,207,138,.45);font-weight:600}
.strip b{background:#f1cf8a;color:#10222f;border-radius:99px;padding:1px 11px;font-weight:800}
.gear{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.tools{display:flex;gap:10px;margin:16px 0}
.tools input,.tools select,.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.tools input{flex:1}.tools select{width:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ph{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 20px -12px rgba(10,30,50,.6);transition:transform .15s}
.tile:active .ph{transform:scale(.97)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(5,12,20,.55))}
.ph .g{width:46%;height:46%;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.tg{position:absolute;z-index:1;font-size:11px;font-weight:800;color:#fff;background:rgba(8,16,26,.55);backdrop-filter:blur(6px);padding:3px 9px;border-radius:99px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{top:8px;right:8px}.bl{bottom:8px;left:8px}.br{bottom:8px;right:8px;background:rgba(241,207,138,.9);color:#1b2630}
.cap{padding:7px 4px 0;display:flex;flex-direction:column}
.cap b{font:800 .95rem/1.25 Manrope,system-ui,sans-serif;letter-spacing:-.005em;font-variant-numeric:lining-nums}
.cap span{color:var(--mute);font-size:11px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:44px 18px;border:1.5px dashed var(--line);border-radius:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:720px;margin:auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:700 11px Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
.tabs button[aria-selected=true]{color:var(--acc)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--gold)}
.fab,.menu,.scrim{--r:max(16px,calc(50% - 344px))}
.fab{position:fixed;z-index:26;right:var(--r);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#16222d;background:linear-gradient(135deg,#f6d98f,#d49b3a);box-shadow:0 10px 24px -6px rgba(180,120,30,.7);transition:transform .2s}
.fab svg{width:28px;height:28px;stroke-width:2.4}.fab.on{transform:rotate(45deg)}
.scrim{position:fixed;inset:0;z-index:22;background:rgba(6,12,20,.5);opacity:0;pointer-events:none;transition:.2s}
.menu{position:fixed;z-index:25;right:var(--r);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.on.scrim,.on.menu{opacity:1;pointer-events:auto;transform:none}
.menu button{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 16px;font:700 13px Manrope,sans-serif;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.menu i{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(6,12,20,.6)}
.dimg{position:relative;aspect-ratio:1/1;max-height:46vh;width:100%;display:grid;place-items:center;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover}.dimg .g{width:40%;height:40%;stroke:rgba(255,255,255,.55);stroke-width:1.1}
.dtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(8,16,26,.6);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.rb svg{width:18px;height:18px}
.db{padding:18px 20px 22px}
.db h2{margin:0 0 10px;font:800 1.65rem/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.015em;font-variant-numeric:lining-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.chip.k{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px}
dt{color:var(--mute);font-size:12px}dd{margin:0;font-weight:600}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg);white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font:800 13px Manrope,sans-serif;border-radius:14px;padding:12px;cursor:pointer;border:1.5px solid var(--acc);background:var(--acc);color:#fff}
:root[data-theme="dark"] .btn:not(.o),:root:not([data-theme="light"]) .btn:not(.o){color:#0b1620}
.btn.o{background:none;color:var(--acc)}.btn.d{background:none;border-color:var(--bad);color:var(--bad)}
.fh{padding:18px 20px 4px}.fh h2{margin:0;font:700 1.7rem 'Cormorant Garamond',serif}
.fb{padding:6px 20px 20px}.f{margin-bottom:11px}.f label{display:block;font-size:12px;font-weight:800;margin-bottom:4px;color:var(--mute)}
.f textarea{min-height:76px;resize:vertical}.pv{margin-top:6px;max-height:110px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
#page{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}
#page.on{display:block;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.pimg{position:relative;background:#0a121a;min-height:280px;display:grid;place-items:center}
.pimg img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain}
.pimg .g{width:30%;height:30%}
.pimg .dtop{top:calc(12px + env(safe-area-inset-top,0px))}
#page .db{max-width:720px;margin:-26px auto 0;position:relative;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(40px + env(safe-area-inset-bottom,0px));min-height:42vh}
.f label.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px;border:2px dashed var(--acc);border-radius:18px;background:color-mix(in srgb,var(--acc) 8%,transparent);color:var(--acc);font-size:14px;font-weight:800;margin:0;cursor:pointer;overflow:hidden;position:relative;text-align:center}
.f label.up svg{width:34px;height:34px}
.f label.up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f label.up small{color:var(--mute);font-weight:600;font-size:12px}
.ghost{display:block;margin:16px auto 0;background:none;border:1.5px dashed var(--line);color:var(--mute);border-radius:99px;padding:9px 18px;font:700 13px Manrope,sans-serif;cursor:pointer}
.ghost:hover,.ghost:focus-visible{color:var(--acc);border-color:var(--acc)}
.fbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:0 14px;font:700 13px Manrope,sans-serif;cursor:pointer;white-space:nowrap;max-width:44%}
.fbtn span{overflow:hidden;text-overflow:ellipsis}.fbtn svg{width:18px;height:18px}
.fbtn.on{border-color:var(--gold);color:var(--gold)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 16px;padding-bottom:2px;scrollbar-width:none}
.fchips[hidden]{display:none}
.fchips button,.cc{flex:none;display:flex;gap:7px;align-items:center;background:var(--card);border:1.5px solid var(--line);color:var(--mute);border-radius:99px;padding:8px 14px;font:800 13px Manrope,sans-serif;cursor:pointer}
.fchips button i{font-style:normal;font-size:11px;opacity:.7}
.fchips button[aria-pressed=true],.cc.on{background:linear-gradient(135deg,#f6d98f,#d49b3a);border-color:transparent;color:#16222d}
.cchips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.v .tabs,.v .fab,.v .menu,.v .scrim,.v .gear{display:none!important}
.shr{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.shr[hidden]{display:none}
.shr input:not([type=file]){font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.shr h3{margin:0 0 6px;font:800 14px Manrope,sans-serif}
.shr p{margin:0 0 10px;color:var(--mute);font-size:13px}
#shlink{margin-bottom:10px;font-size:12px}
.tg.tr{max-width:50%}
.tg.st{top:8px;left:8px;max-width:46%}
.tg.st.w{background:#c98f2b;color:#1b2630}.tg.st.i{background:#7c5bc0}.tg.st.c{background:#2a9a6f}
.seg{display:flex;gap:6px;margin:0 0 16px}
.seg button{flex:1;border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:12px;padding:10px 4px;font:800 12px Manrope,sans-serif;cursor:pointer}
.seg button.on{color:#fff;border-color:transparent}.seg .w.on{background:#c98f2b;color:#1b2630}.seg .i.on{background:#7c5bc0}.seg .c.on{background:#2a9a6f}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <button class="gear" id="gear" aria-label="Backup and restore"></button>
    <svg class="gem" viewBox="0 0 64 64"><path d="M16 8h32l12 16-28 32L4 24z"/><path d="M4 24h56M22 24l10 32 10-32M16 8l6 16 10-16 10 16 6-16"/></svg>
    <svg class="gem gem2" viewBox="0 0 64 64"><path d="M16 8h32l12 16-28 32L4 24z"/><path d="M4 24h56M22 24l10 32 10-32"/></svg>
    <div class="nm">Sagar’s</div><h1>CAD STUDIO</h1>
    <div class="strip"><span id="sub"></span><b id="cnt"></b></div>
  </section>
  <div class="tools">
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <button class="fbtn" id="catb" aria-label="Filter by category"></button>
  </div>
  <div class="fchips" id="fchips" role="group" aria-label="Filter by progress"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="menu" id="menu"></div>
<button class="fab" id="fab" aria-label="Add design" aria-expanded="false"></button>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<div id="page"></div>
<dialog id="dlg"></dialog>

<script>
const P={
back:'<path d="M15 5l-7 7 7 7"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',

reference:'<path d="M6 3h12v18l-6-4-6 4z"/>',practice:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
scrapped:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const GEM='<svg class="g" viewBox="0 0 64 64"><path d="M16 8h32l12 16-28 32L4 24z"/><path d="M4 24h56M22 24l10 32 10-32M16 8l6 16 10-16 10 16 6-16"/></svg>';
const CATS=['Ring','Pendant','Earrings','Bangle','Bracelet','Necklace','Chain','Brooch','Other'];
const SKILLS=['Modeling','Gem placement','Prong setting','Head builder','Pavé','Bezel','Channel','Halo','Shank','Bangle','Chain','Sculpting','Rendering','Other'];
const SW=['Matrix 9','MatrixGold 4','Rhino','ZBrush','Blender','Other'];
const STR=['In idea','Still working','Completed'],STP=['Still working','Completed'];
const MS={'24K Gold':'19.30 - 19.32','22K Yellow':'17.80','18K Yellow':'15.50 - 15.60','18K White (Ni)':'14.60 - 14.70','18K White (Pd)':'15.80','18K Rose':'15.15 - 15.20','14K Yellow':'13.10 - 13.50','14K White':'12.60 - 13.00','14K Rose':'13.25','10K Yellow':'11.50','10K White':'11.10','9K Gold':'11.15','Pt 950':'20.50 - 21.65','Pt 900':'21.50','Pd 950':'12.00','Silver 999':'10.50','Silver 925':'10.35 - 10.50','Brass':'8.50','Bronze':'8.70','Copper':'8.95','Titanium':'4.50','Steel 316L':'7.90'};
const MT=Object.keys(MS);
const MM={'24k gold':'24K Gold','22k gold':'22K Yellow','18k yellow gold':'18K Yellow','18k white gold':'18K White (Ni)','18k rose gold':'18K Rose','14k yellow gold':'14K Yellow','14k white gold':'14K White','14k rose gold':'14K Rose','sterling silver':'Silver 925','platinum':'Pt 950'};
const RS='14.0,44.0,3,F,44,4,4;14.5,45.5,3.5,G,45.5,5.5,5;14.9,46.8,4,H,47,7,7;15.3,48.0,4.5,I,48,8,8;15.7,49.3,5,J 1/2,49,9,9;16.1,50.6,5.5,L,51,11,10;16.5,51.9,6,M,52,12,12;16.9,53.1,6.5,N,53,13,13;17.3,54.4,7,O,54.5,14.5,14;17.7,55.7,7.5,P,56,16,15;18.1,57.0,8,Q,57,17,16;18.5,58.3,8.5,Q 1/2,58,18,17;19.0,59.5,9,R 1/2,59.5,19.5,18;19.4,60.8,9.5,S 1/2,61,21,19;19.8,62.1,10,T 1/2,62,22,20;20.2,63.4,10.5,U 1/2,63.5,23.5,22;20.6,64.6,11,V 1/2,65,25,23;21.0,65.9,11.5,W 1/2,66,26,24;21.4,67.2,12,Y,67,27,25;21.8,68.5,12.5,Z,68.5,28.5,26;22.2,69.7,13,Z + 1,70,30,27'.split(';').map(r=>r.split(','));
const RINGS=RS.map(r=>`US ${r[2]} (${r[0]} mm)`),BANG=['Bangle 57 mm (2.2)','Bangle 60 mm','Bangle 63.5 mm (2.4)','Bangle 67 mm','Bangle 70 mm (2.6)','Bangle 73 mm','Bangle 76 mm (2.8)'],BRAC=['6.5 in (16.5 cm)','7 in (17.8 cm)','7.5 in (19 cm)','8 in (20 cm)'],CHAIN=['14 in (35 cm)','16 in (40 cm)','18 in (45 cm)','20 in (50 cm)','22 in (55 cm)','24 in (60 cm)'];
const sizeFor=c=>c==='Ring'?RINGS:c==='Bangle'?BANG:c==='Bracelet'?BRAC:(c==='Necklace'||c==='Pendant'||c==='Chain')?CHAIN:[];
const pickOpts=(xs,v)=>`<option value="">Select</option>${xs.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}<option value="__o"${v&&!xs.includes(v)?' selected':''}>Other (type it manually)</option>`;
const WT=['1 to 2 g','2 to 3 g','3 to 5 g','5 to 8 g','8 to 12 g','12 to 20 g'];
const SN=['No stones','Diamond','Ruby','Sapphire','Emerald','Amethyst','Aquamarine','Citrine','Garnet','Peridot','Topaz','Tanzanite','Tourmaline','Opal','Pearl','CZ','Moissanite'];
const CUT=['Round','Princess','Oval','Pear','Marquise','Emerald','Cushion','Radiant','Heart','Asscher','Trillion','Triangle','Baguette','Tapered baguette','Cabochon'];
const SET=['Prong','Bezel','Pavé','Micro pavé','Channel','Flush','Halo','Tension','Cluster','Illusion'];
const SS=['1.0 mm','1.3 mm','1.5 mm','1.7 mm','2.0 mm','2.5 mm','3.0 mm','3.5 mm','4.0 mm','4.1 mm (0.25 ct)','4.5 mm','5.2 mm (0.50 ct)','5.8 mm (0.75 ct)','6.5 mm (1 ct)','7.4 mm (1.5 ct)','8.2 mm (2 ct)','9.0 mm','10 mm'];
const SC={'In idea':'i','Still working':'w','Completed':'c'},SH={'In idea':'Idea','Still working':'Working','Completed':'Done'};
// field: [key,label,type,options or placeholder,required]
const T={
catalogue:{label:'Catalogue',one:'design',sub:'Completed projects',tr:'sw',bl:'cat',br:'wt',empty:'No finished designs yet. Tap + to add your first piece.',f:[
 ['img','Upload image','image','',1],['name','Design name','text','',1],['cat','Category','select',CATS],['wt','Weight','pick',WT],['size','Size','pick',RINGS],
 ['sw','Software','select',SW],['metal','Metal type','pick',MT],['stones','Stone type','pick',SN],['cut','Stone cut','pick',CUT],['ssize','Stone size','pick',SS],['setting','Setting style','pick',SET],['date','Date finished','date'],['notes','Notes','textarea']]},
reference:{label:'Reference',one:'reference',sub:'Saved references',tr:'metal',bl:'cat',br:'wt',empty:'No references saved. Tap + to add an image you want to learn from.',f:[
 ['img','Upload image','image','',1],['name','Title','text','',1],['status','Status','select',STR],['cat','Category','select',CATS],
 ['wt','Weight range','pick',WT],['size','Size','pick',RINGS],['metal','Metal type','pick',MT],['stones','Stone type','pick',SN],['cut','Stone cut','pick',CUT],['ssize','Stone size','pick',SS],['setting','Setting style','pick',SET],['deadline','Finish before','date'],
 ['source','Where it is from','text','e.g. Pinterest, book'],['style','Style','text','e.g. Art deco'],['date','Date saved','date'],['notes','What to study in it','textarea']]},
practice:{label:'Practice',one:'session',sub:'Practice sessions',tr:'sw',bl:'cat',br:'mins',empty:'No practice logged. Tap + to log today’s session.',f:[
 ['img','Upload image','image','',1],['name','What you practised','text','e.g. 6-prong setting',1],['status','Status','select',STP],['cat','Skill','select',SKILLS],
 ['mins','Minutes spent','number'],['sw','Software','select',SW],['start','Start date','date'],['end','Completion date','date'],['notes','What you learned or want to fix','textarea']]}};
const TABS=['catalogue','reference','practice','scrapped'];

  else if(ty==='pick'){const xs=k==='size'?sizeFor(it.cat||CATS[0]):x;c=`<select id="f_${k}" data-pick="1">${pickOpts(xs,v)}</select><input id="o_${k}" value="${v&&!xs.includes(v)?esc(v):''}" placeholder="Type it here" style="margin-top:6px"${v&&!xs.includes(v)?'':' hidden'}>`}
  else if(ty==='textarea')c=`<textarea id="f_${k}">${esc(v)}</textarea>`;
  else if(ty==='image')c=`<label class="up" id="upz" for="f_${k}">${src(it)?`<img src="${src(it)}" alt="">`:`${ic('plus')}<span>Tap to upload an image</span><small>From gallery or camera</small>`}</label><input type="file" id="f_${k}" accept="image/*" hidden>`;
  else c=`<input type="${ty}" id="f_${k}" value="${esc(v)}" placeholder="${esc(x||'')}"${ty==='number'?' min="1" inputmode="numeric"':''}>`;
  return `<div class="f"><label for="f_${k}">${l}${r?' *':''}</label>${c}</div>`}).join('')+
 `<div class="row"><button class="btn o" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div></div>`;
 const cs=$('#f_cat'),ss=$('#f_size');if(cs&&ss)cs.onchange=()=>{ss.innerHTML=pickOpts(sizeFor(cs.value),'');$('#o_size').value='';$('#o_size').hidden=true};
 document.querySelectorAll('select[data-pick]').forEach(sl=>sl.onchange=()=>{const o=$('#o_'+sl.id.slice(2));o.hidden=sl.value!=='__o';if(!o.hidden)o.focus()});
 $('#cx').onclick=()=>$('#dlg').close();
 const fi=$('#f_img');fi.onchange=()=>{const f=fi.files[0];if(f)$('#upz').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`};
 $('#sv').onclick=async()=>{
  const o=Object.assign({ts:Date.now()},it,{id:it.id||uid(),type});
  for(const [k,l,ty,x,r] of t.f){const el=$('#f_'+k);
   if(ty==='image'){if(el.files[0])o.img=await shrink(el.files[0]);else if(r&&!src(o)){$('#upz').style.borderColor='var(--bad)';toast('Please upload an image first');return}}
   else if(ty==='pick')o[k]=el.value==='__o'?$('#o_'+k).value.trim():el.value;else{o[k]=el.value.trim();if(r&&!o[k]){el.focus();el.style.borderColor='var(--bad)';return}}}
  if(o.status==='Completed'&&type==='practice'&&!o.end)o.end=today();if(!id)D.items.push(o);else D.items=D.items.map(x=>x.id===id?o:x);
  save();if(!o.scrapped)tab=type;q='';cf='';fs=o.status||'Still working';$('#q').value='';render();$('#dlg').close();if($('#page').classList.contains('on'))detail(o.id);toast(id?'Saved':'Added to '+t.label);
 };
 if(!$('#dlg').open)$('#dlg').showModal();$('#dlg').scrollTop=0;
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.74))};im.src=r.result};r.readAsDataURL(file)})}
function settings(){
 $('#dlg').innerHTML=`<div class="fh"><h2>Backup</h2></div><div class="fb"><p class="mute" style="color:var(--mute)">Your studio is saved in this browser. Download a backup to keep it safe or move it to another device.</p>
 <div class="row"><button class="btn" id="ex">Download backup</button><button class="btn o" id="im">Restore</button></div><div class="row"><button class="btn o" id="exs">Show examples</button><button class="btn o" id="exr">Remove examples</button></div><div class="shr" id="shr1"><h3>Share catalogue (view only)</h3><p id="shtxt"></p><input id="shlink" readonly hidden><div class="row" id="shrow"></div><div class="row"><button class="btn o" id="gh">Export for GitHub (catalogue.json)</button></div></div>
 <div class="shr" id="ghbox"><h3>Share from GitHub (no Claude needed)</h3><p id="ghtxt"></p><div id="ghf"></div><div class="row"><button class="btn o" id="gh2">Download catalogue.json instead</button></div></div>
 <div class="row"><button class="btn o" id="cx">Close</button></div>
 <input type="file" id="imf" accept="application/json" hidden></div>`;
 $('#cx').onclick=()=>$('#dlg').close();
 shareUI();$('#gh').onclick=exportCat;$('#gh2').onclick=exportCat;const hc=!!(window.claude&&claude.use);$('#shr1').hidden=!hc;$('#ghbox').hidden=hc;ghUI();
 $('#exs').onclick=()=>{seed();render();$('#dlg').close();toast('Examples added')};
 $('#exr').onclick=()=>{D.items=D.items.filter(i=>!i.ex);save();render();$('#dlg').close();toast('Examples removed')};
 $('#ex').onclick=()=>saveFile('cad-studio-backup.json',JSON.stringify(D));
 $('#im').onclick=()=>$('#imf').click();
 $('#imf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(s=>{try{const j=JSON.parse(s);if(!Array.isArray(j.items))throw 0;if(confirm('Replace everything with this backup?')){D=j;save();render();$('#dlg').close()}}catch(x){toast('That is not a valid backup file')}})};
 $('#dlg').showModal();
}
function menu(on){$('#menu').classList.toggle('on',on);$('#scrim').classList.toggle('on',on);$('#fab').classList.toggle('on',on);$('#fab').setAttribute('aria-expanded',on)}

$('#fab').innerHTML=ic('plus');$('#gear').innerHTML=ic('dots');
$('#menu').innerHTML=['catalogue','reference','practice'].map(t=>`<button data-a="${t}">Add to ${T[t].label}<i>${ic(t)}</i></button>`).join('');
$('#fab').onclick=()=>menu(!$('#menu').classList.contains('on'));
$('#scrim').onclick=()=>menu(false);
$('#menu').onclick=e=>{const b=e.target.closest('[data-a]');if(b){menu(false);form(b.dataset.a)}};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;q='';cf='';fs='Still working';$('#q').value='';render();scrollTo(0,0)}};
$('#grid').onclick=e=>{if(e.target.closest('[data-ex]')){seed();render();toast('Examples added. Remove them anytime from the ⋯ menu');return}const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#fchips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fs=b.dataset.f;render()}};
$('#catb').onclick=catSheet;
$('#gear').onclick=settings;
$('#dlg').onclick=e=>{if(e.target===$('#dlg'))$('#dlg').close()};
load();if((D.v||0)<3){D.items=D.items.filter(i=>!i.ex);D.v=3;save()}
D.items.forEach(i=>{if(i.type==='practice'&&!i.start&&i.date)i.start=i.date;if(!i.status&&i.type==='reference')i.status='In idea';if(!i.status&&i.type==='practice')i.status='Completed';const mk=(i.metal||'').toLowerCase();if(MM[mk])i.metal=MM[mk];const sm=/^US ([\d.]+)$/.exec(i.size||''),sr=sm&&RS.find(x=>x[2]===sm[1]);if(sr)i.size=`US ${sr[2]} (${sr[0]} mm)`;if((i.stones||'').toLowerCase()==='cubic zirconia')i.stones='CZ'});addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').open)closePage()});
if(VIEW)startView();else{render();if(window.claude&&claude.use)claude.use('user').then(async u=>{if(u&&(await u.isOwner())===false)startView()}).catch(()=>{});if(D.share)schedSync()}
</script>
