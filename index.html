<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202c;--mute:#667585;--line:#d8dee6;--acc:#1c6a8a;--gold:#b8862f;--bad:#b4475a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 170px}
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:18px 18px 0;background:linear-gradient(135deg,#0d2f45 0%,#1c6a8a 60%,#2b8fa0 100%);box-shadow:0 10px 30px -12px rgba(15,60,90,.55)}
.hero .gem{position:absolute;right:-14px;top:-10px;width:170px;height:170px;opacity:.16;stroke-width:1.1}
.hero .gem2{right:80px;top:70px;width:80px;height:80px;opacity:.12}
.hero h1{margin:0;font:700 2.5rem/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.09em;position:relative}
.hero .nm{font:italic 600 1.7rem 'Cormorant Garamond',serif;color:#f1cf8a;position:relative}
.strip{position:relative;margin:16px -18px 0;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(6,20,32,.38);border-top:1px solid rgba(241,207,138,.45);font-weight:600}
.strip b{background:#f1cf8a;color:#10222f;border-radius:99px;padding:1px 11px;font-weight:800}
.gear{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.tools{display:flex;gap:10px;margin:16px 0}
.tools input,.tools select,.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.tools input{flex:1}.tools select{width:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ph{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 20px -12px rgba(10,30,50,.6);transition:transform .15s}
.tile:active .ph{transform:scale(.97)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(5,12,20,.55))}
.ph .g{width:46%;height:46%;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.tg{position:absolute;z-index:1;font-size:9.5px;font-weight:800;letter-spacing:.04em;line-height:14px;color:#fff;background:rgba(8,16,26,.6);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);padding:2px 8px;border-radius:99px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px -3px rgba(0,0,0,.6)}
.tr{top:8px;right:8px}.bl{bottom:8px;left:8px}.br{bottom:8px;right:8px;background:linear-gradient(135deg,rgba(246,217,143,.96),rgba(212,155,58,.96));border-color:rgba(255,236,190,.7);color:#1b2630;box-shadow:0 0 10px -2px rgba(224,181,101,.55)}
.cap{padding:7px 4px 0;display:flex;flex-direction:column}
.cap b{font:800 .95rem/1.25 Manrope,system-ui,sans-serif;letter-spacing:-.005em;font-variant-numeric:lining-nums}
.cap span{color:var(--mute);font-size:11px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:44px 18px;border:1.5px dashed var(--line);border-radius:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:720px;margin:auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:700 11px Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
.tabs button[aria-selected=true]{color:var(--acc)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--gold)}
.fab,.menu,.scrim{--r:max(16px,calc(50% - 344px))}
.fab{position:fixed;z-index:26;right:var(--r);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#16222d;background:linear-gradient(135deg,#f6d98f,#d49b3a);box-shadow:0 10px 24px -6px rgba(180,120,30,.7);transition:transform .2s}
.fab svg{width:28px;height:28px;stroke-width:2.4}.fab.on{transform:rotate(45deg)}
.scrim{position:fixed;inset:0;z-index:22;background:rgba(6,12,20,.5);opacity:0;pointer-events:none;transition:.2s}
.menu{position:fixed;z-index:25;right:var(--r);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.on.scrim,.on.menu{opacity:1;pointer-events:auto;transform:none}
.menu button{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 16px;font:700 13px Manrope,sans-serif;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.menu i{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(6,12,20,.6)}
.dimg{position:relative;aspect-ratio:1/1;max-height:46vh;width:100%;display:grid;place-items:center;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover}.dimg .g{width:40%;height:40%;stroke:rgba(255,255,255,.55);stroke-width:1.1}
.dtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(8,16,26,.6);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.rb svg{width:18px;height:18px}
.db{padding:18px 20px 22px}
.db h2{margin:0 0 10px;font:800 1.65rem/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.015em;font-variant-numeric:lining-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;line-height:16px;padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--acc) 11%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 36%,transparent);box-shadow:0 0 10px -5px var(--acc);white-space:nowrap}
.chip.k{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 46%,transparent);box-shadow:0 0 10px -5px var(--gold)}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px}
dt{color:var(--mute);font-size:12px}dd{margin:0;font-weight:600}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg);white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font:800 13px Manrope,sans-serif;border-radius:14px;padding:12px;cursor:pointer;border:1.5px solid var(--acc);background:var(--acc);color:#fff}
:root[data-theme="dark"] .btn:not(.o),:root:not([data-theme="light"]) .btn:not(.o){color:#0b1620}
.btn.o{background:none;color:var(--acc)}.btn.d{background:none;border-color:var(--bad);color:var(--bad)}
.fh{padding:18px 20px 4px}.fh h2{margin:0;font:700 1.7rem 'Cormorant Garamond',serif}
.fb{padding:6px 20px 20px}.f{margin-bottom:11px}.f label{display:block;font-size:12px;font-weight:800;margin-bottom:4px;color:var(--mute)}
