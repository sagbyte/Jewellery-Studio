<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagar’s CAD Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202c;--mute:#667585;--line:#d8dee6;--acc:#1c6a8a;--gold:#b8862f;--bad:#b4475a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c131b;--card:#16212d;--ink:#e9eef3;--mute:#94a3b3;--line:#263444;--acc:#62b8d4;--gold:#e0b565;--bad:#e5808f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 170px}
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:18px 18px 0;background:linear-gradient(135deg,#0d2f45 0%,#1c6a8a 60%,#2b8fa0 100%);box-shadow:0 10px 30px -12px rgba(15,60,90,.55)}
.hero .gem{position:absolute;right:-14px;top:-10px;width:170px;height:170px;opacity:.16;stroke-width:1.1}
.hero .gem2{right:80px;top:70px;width:80px;height:80px;opacity:.12}
.hero h1{margin:0;font:700 2.5rem/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.09em;position:relative}
.hero .nm{font:italic 600 1.7rem 'Cormorant Garamond',serif;color:#f1cf8a;position:relative}
.strip{position:relative;margin:16px -18px 0;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(6,20,32,.38);border-top:1px solid rgba(241,207,138,.45);font-weight:600}
.strip b{background:#f1cf8a;color:#10222f;border-radius:99px;padding:1px 11px;font-weight:800}
.gear{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.tools{display:flex;gap:10px;margin:16px 0}
.tools input,.tools select,.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.tools input{flex:1}.tools select{width:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ph{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;display:grid;place-items:center;box-shadow:0 8px 20px -12px rgba(10,30,50,.6);transition:transform .15s}
.tile:active .ph{transform:scale(.97)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(5,12,20,.55))}
.ph .g{width:46%;height:46%;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.tg{position:absolute;z-index:1;font-size:11px;font-weight:800;color:#fff;background:rgba(8,16,26,.55);backdrop-filter:blur(6px);padding:3px 9px;border-radius:99px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{top:8px;right:8px}.bl{bottom:8px;left:8px}.br{bottom:8px;right:8px;background:rgba(241,207,138,.9);color:#1b2630}
.cap{padding:7px 4px 0;display:flex;flex-direction:column}
.cap b{font:800 .95rem/1.25 Manrope,system-ui,sans-serif;letter-spacing:-.005em;font-variant-numeric:lining-nums}
.cap span{color:var(--mute);font-size:11px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:44px 18px;border:1.5px dashed var(--line);border-radius:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:720px;margin:auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:700 11px Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
.tabs button[aria-selected=true]{color:var(--acc)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--gold)}
.fab,.menu,.scrim{--r:max(16px,calc(50% - 344px))}
.fab{position:fixed;z-index:26;right:var(--r);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#16222d;background:linear-gradient(135deg,#f6d98f,#d49b3a);box-shadow:0 10px 24px -6px rgba(180,120,30,.7);transition:transform .2s}
.fab svg{width:28px;height:28px;stroke-width:2.4}.fab.on{transform:rotate(45deg)}
.scrim{position:fixed;inset:0;z-index:22;background:rgba(6,12,20,.5);opacity:0;pointer-events:none;transition:.2s}
.menu{position:fixed;z-index:25;right:var(--r);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.on.scrim,.on.menu{opacity:1;pointer-events:auto;transform:none}
.menu button{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 16px;font:700 13px Manrope,sans-serif;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.menu i{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(6,12,20,.6)}
.dimg{position:relative;aspect-ratio:1/1;max-height:46vh;width:100%;display:grid;place-items:center;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover}.dimg .g{width:40%;height:40%;stroke:rgba(255,255,255,.55);stroke-width:1.1}
.dtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(8,16,26,.6);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.rb svg{width:18px;height:18px}
.db{padding:18px 20px 22px}
.db h2{margin:0 0 10px;font:800 1.65rem/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.015em;font-variant-numeric:lining-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.chip.k{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px}
dt{color:var(--mute);font-size:12px}dd{margin:0;font-weight:600}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg);white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font:800 13px Manrope,sans-serif;border-radius:14px;padding:12px;cursor:pointer;border:1.5px solid var(--acc);background:var(--acc);color:#fff}
:root[data-theme="dark"] .btn:not(.o),:root:not([data-theme="light"]) .btn:not(.o){color:#0b1620}
.btn.o{background:none;color:var(--acc)}.btn.d{background:none;border-color:var(--bad);color:var(--bad)}
.fh{padding:18px 20px 4px}.fh h2{margin:0;font:700 1.7rem 'Cormorant Garamond',serif}
.fb{padding:6px 20px 20px}.f{margin-bottom:11px}.f label{display:block;font-size:12px;font-weight:800;margin-bottom:4px;color:var(--mute)}
.f textarea{min-height:76px;resize:vertical}.pv{margin-top:6px;max-height:110px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
#page{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overscroll-behavior:contain}
#page.on{display:block;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.pimg{position:relative;background:#0a121a;min-height:280px;display:grid;place-items:center}
.pimg img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain}
.pimg .g{width:30%;height:30%}
.pimg .dtop{top:calc(12px + env(safe-area-inset-top,0px))}
#page .db{max-width:720px;margin:-26px auto 0;position:relative;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(40px + env(safe-area-inset-bottom,0px));min-height:42vh}
.f label.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px;border:2px dashed var(--acc);border-radius:18px;background:color-mix(in srgb,var(--acc) 8%,transparent);color:var(--acc);font-size:14px;font-weight:800;margin:0;cursor:pointer;overflow:hidden;position:relative;text-align:center}
.f label.up svg{width:34px;height:34px}
.f label.up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f label.up small{color:var(--mute);font-weight:600;font-size:12px}
.ghost{display:block;margin:16px auto 0;background:none;border:1.5px dashed var(--line);color:var(--mute);border-radius:99px;padding:9px 18px;font:700 13px Manrope,sans-serif;cursor:pointer}
.ghost:hover,.ghost:focus-visible{color:var(--acc);border-color:var(--acc)}
.fbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:0 14px;font:700 13px Manrope,sans-serif;cursor:pointer;white-space:nowrap;max-width:44%}
.fbtn span{overflow:hidden;text-overflow:ellipsis}.fbtn svg{width:18px;height:18px}
.fbtn.on{border-color:var(--gold);color:var(--gold)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 16px;padding-bottom:2px;scrollbar-width:none}
.fchips[hidden]{display:none}
.fchips button,.cc{flex:none;display:flex;gap:7px;align-items:center;background:var(--card);border:1.5px solid var(--line);color:var(--mute);border-radius:99px;padding:8px 14px;font:800 13px Manrope,sans-serif;cursor:pointer}
.fchips button i{font-style:normal;font-size:11px;opacity:.7}
.fchips button[aria-pressed=true],.cc.on{background:linear-gradient(135deg,#f6d98f,#d49b3a);border-color:transparent;color:#16222d}
.cchips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.v .tabs,.v .fab,.v .menu,.v .scrim,.v .gear{display:none!important}
.shr{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#zoom{display:none;position:fixed;inset:0;z-index:80;background:#05090f;touch-action:none;overflow:hidden}
#zoom.on{display:block}
#zoom img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;touch-action:none;max-width:none}
#zoom .zx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:3}
#zoom .zh{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}
.zb{position:absolute;right:12px;bottom:40px;z-index:2}
.shr[hidden]{display:none}
.shr input:not([type=file]){font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.shr h3{margin:0 0 6px;font:800 14px Manrope,sans-serif}
.shr p{margin:0 0 10px;color:var(--mute);font-size:13px}
#shlink{margin-bottom:10px;font-size:12px}
.tg.tr{max-width:50%}
.tg.st{top:8px;left:8px;max-width:46%}
.tg.st.w{background:#c98f2b;color:#1b2630}.tg.st.i{background:#7c5bc0}.tg.st.c{background:#2a9a6f}
.seg{display:flex;gap:6px;margin:0 0 16px}
.seg button{flex:1;border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:12px;padding:10px 4px;font:800 12px Manrope,sans-serif;cursor:pointer}
.seg button.on{color:#fff;border-color:transparent}.seg .w.on{background:#c98f2b;color:#1b2630}.seg .i.on{background:#7c5bc0}.seg .c.on{background:#2a9a6f}
.mute{color:var(--mute)}
.tools2{margin:-6px 0 14px}
.tools2 select{width:100%;font-weight:700}
.tg svg{width:11px;height:11px;margin-right:3px;vertical-align:-1px}
.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.pl svg{width:34px;height:34px;fill:#fff;stroke:none;opacity:.9}
.cap .nm2{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center}
.uid{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px;line-height:17px;background:color-mix(in srgb,var(--gold) 10%,transparent);white-space:nowrap}
.db h2 .uid{font-size:12px;vertical-align:middle;margin-left:4px}
.cap{align-items:flex-start}
.rsn{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;color:color-mix(in srgb,var(--c) 75%,var(--ink));background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.cc[style*="--c"]{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.car-w{position:relative;background:#0a121a}
.car-w .dtop{top:calc(12px + env(safe-area-inset-top,0px))}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(72vh,540px);overscroll-behavior-x:contain;outline:none}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:grid;place-items:center;overflow:hidden}
.sl img,.sl video{width:100%;height:100%;object-fit:contain;display:block}
.sl .g{width:30%;height:30%;stroke:rgba(255,255,255,.55);stroke-width:1.1}
.tgs{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:12px;right:60px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;pointer-events:none}
.tgs span{font-size:11px;font-weight:800;color:#fff;background:rgba(8,16,26,.6);backdrop-filter:blur(6px);padding:3px 10px;border-radius:99px;border:1px solid rgba(241,207,138,.55)}
.sl.ds{display:block;overflow-y:auto;background:linear-gradient(160deg,#0d2f45,#14202c);color:#fff}
.dc{max-width:560px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top,0px)) 54px 40px}
.dc small{color:#f1cf8a;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.dc h3{margin:6px 0 14px;font:700 1.7rem/1.1 'Cormorant Garamond',Georgia,serif}
.dc .dtxt{color:rgba(255,255,255,.92)}
.dtxt{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.cb{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(8,16,26,.55);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer}
.cb.l{left:8px}.cb.r{right:8px}.cb.r svg{transform:rotate(180deg)}.cb[disabled]{opacity:.28;cursor:default}
.dots{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;display:flex;gap:7px;align-items:center;padding:6px 10px;border-radius:99px;background:rgba(8,16,26,.5);backdrop-filter:blur(6px);max-width:calc(100% - 140px)}
.dt{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.4);cursor:pointer;flex:none}
.dt.on{background:#f1cf8a;width:18px;border-radius:4px}
.dt.dd{border-radius:2px}
.dn{color:#fff;font-size:11px;font-weight:800}
.stabs{display:flex;gap:6px;margin:6px 0 14px;background:var(--bg);padding:4px;border-radius:14px}
.stabs button{flex:1;border:0;background:none;color:var(--mute);font:800 12.5px Manrope,sans-serif;padding:9px 4px;border-radius:11px;cursor:pointer}
.stabs button[aria-selected=true]{background:var(--card);color:var(--acc);box-shadow:0 2px 8px -3px rgba(0,0,0,.35)}
[hidden]{display:none!important}
table.spec{width:100%;border-collapse:collapse;margin-bottom:6px}
table.spec th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;width:38%;padding:9px 10px 9px 0;vertical-align:top;border-bottom:1px solid var(--line)}
table.spec td{font-weight:600;padding:9px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.spec h3,.shr h3{margin:16px 0 4px;font:800 12px Manrope,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mg button{padding:0;border:0;background:#0a121a;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1;cursor:pointer}
.mg img,.mg video{width:100%;height:100%;object-fit:cover;display:block}
.mg .tgs{top:auto;bottom:6px;left:6px;right:6px;gap:4px}
.mg .tgs span{font-size:9.5px;padding:2px 7px}
.mr{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;flex-wrap:wrap;background:var(--bg)}
.mr .th{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#0a121a;position:relative;flex:none}
.mr .th img,.mr .th video{width:100%;height:100%;object-fit:cover;display:block}
.mr .th b{position:absolute;left:3px;bottom:3px;font-size:9px;background:#f1cf8a;color:#1b2630;border-radius:6px;padding:0 5px}
.mr .mi{flex:1;min-width:0}
.mtags{display:flex;flex-wrap:wrap;gap:4px}
.mtags span{font-size:10.5px;font-weight:800;color:#fff;background:#1c3a52;padding:2px 9px;border-radius:99px}
.mb{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.mb button{font:800 11px Manrope,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.mb button[disabled]{opacity:.35}
.mb button.d{color:var(--bad);border-color:var(--bad)}
.mb button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tp{width:100%;padding-top:4px;border-top:1px dashed var(--line)}
.tp h4{margin:8px 0 0;font-size:11px;color:var(--mute)}
.tp input{flex:1;min-width:120px;font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <button class="gear" id="gear" aria-label="Backup and restore"></button>
    <svg class="gem" viewBox="0 0 64 64"><path d="M16 8h32l12 16-28 32L4 24z"/><path d="M4 24h56M22 24l10 32 10-32M16 8l6 16 10-16 10 16 6-16"/></svg>
    <svg class="gem gem2" viewBox="0 0 64 64"><path d="M16 8h32l12 16-28 32L4 24z"/><path d="M4 24h56M22 24l10 32 10-32"/></svg>
    <div class="nm">Sagar’s</div><h1>CAD STUDIO</h1>
    <div class="strip"><span id="sub"></span><b id="cnt"></b></div>
  </section>
  <div class="tools">
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <button class="fbtn" id="catb" aria-label="Filter by category"></button>
  </div>
  <div class="tools tools2"><select id="so" aria-label="Sort projects"></select></div>
  <div class="fchips" id="fchips" role="group" aria-label="Filter by progress"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="menu" id="menu"></div>
<button class="fab" id="fab" aria-label="Add design" aria-expanded="false"></button>

 $('#p-media').onclick=e=>{const b=e.target.closest('[data-g]');if(b){$('#page').scrollTo({top:0,behavior:'smooth'});go(+b.dataset.g)}};
 $('#page .stabs').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;SP=b.dataset.p;document.querySelectorAll('.stabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.p===SP));['spec','desc','media'].forEach(k=>$('#p-'+k).hidden=k!==SP)};
 $('#cl').onclick=closePage;if($('#ed'))$('#ed').onclick=()=>form(i.type,id);
 document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{i.status=b.dataset.s;fs=i.status;if(i.type==='practice'){if(i.status==='Completed'&&!i.end)i.end=today();if(i.status==='Still working')i.end=''}save();render();detail(id);toast('Status: '+i.status)});
 document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>moveTo(i,b.dataset.mv));
 if(VIEW){}else if(i.scrapped){$('#rs').onclick=()=>{i.scrapped=false;save();closePage();render();toast('Restored to '+t.label)};
  $('#df').onclick=()=>{if(confirm('Delete this permanently?')){purge(i);D.items=D.items.filter(x=>x!==i);save();closePage();render()}}}
 else{$('#sc').onclick=()=>scrapDlg(id);
  $('#dl').onclick=()=>{if(confirm('Delete this permanently? This cannot be undone.')){purge(i);D.items=D.items.filter(x=>x!==i);save();closePage();render();toast('Deleted')}}}
}
addEventListener('keydown',e=>{if(!$('#page').classList.contains('on')||$('#zoom').classList.contains('on')||$('#dlg').open||!CARGO)return;const tg=e.target;if(tg&&tg.closest&&tg.closest('input,textarea,select,video'))return;
 if(e.key==='ArrowRight'){e.preventDefault();CARGO(CI+1)}else if(e.key==='ArrowLeft'){e.preventDefault();CARGO(CI-1)}});
function moveTo(i,nt){const id=i.id;i.type=nt;
 if(nt==='reference'&&!STR.includes(i.status))i.status='In idea';
 if(nt==='practice'){if(!STP.includes(i.status))i.status='Still working';if(!i.start)i.start=i.date||today()}
 tab=nt;fs=i.status||'Still working';q='';cf='';rf='';$('#q').value='';save();render();detail(id);toast('Moved to '+T[nt].label)}
function scrapDlg(id){const i=D.items.find(x=>x.id===id);if(!i)return;let sel=SRN.includes(i.scrapReason)?i.scrapReason:'';
 $('#dlg').innerHTML=`<div class="fh"><h2>Why scrap it?</h2></div><div class="fb"><div class="cchips" id="rc">${SRN.map(r=>`<button class="cc" data-r="${esc(r)}" style="--c:${rcol(r)}">${esc(r)}</button>`).join('')}</div><div class="f" style="margin-top:12px"><label for="rcu">Or type your own reason</label><input id="rcu" placeholder="Custom reason" value="${esc(i.scrapReason&&!SRN.includes(i.scrapReason)?i.scrapReason:'')}"></div><div class="row"><button class="btn o" id="cx">Cancel</button><button class="btn" id="rok">Move to Scrapped</button></div></div>`;
 const mark=()=>document.querySelectorAll('#rc .cc').forEach(b=>b.classList.toggle('on',b.dataset.r===sel));mark();
 $('#rc').onclick=e=>{const b=e.target.closest('[data-r]');if(b){sel=b.dataset.r;$('#rcu').value='';mark()}};
 $('#rcu').oninput=()=>{sel='';mark()};
 $('#cx').onclick=()=>$('#dlg').close();
 $('#rok').onclick=()=>{const r=$('#rcu').value.trim()||sel;if(!r){toast('Pick a reason first');return}i.scrapped=true;i.scrapReason=r;save();$('#dlg').close();closePage();render();toast('Moved to Scrapped')};
 $('#dlg').showModal()}
function tagPanel(m){const cu=m.tags.filter(x=>!TGV.includes(x)&&!TGC.includes(x)),ch=g=>g.map(x=>`<button type="button" data-tg="${esc(x)}" class="${m.tags.includes(x)?'on':''}">${esc(x)}</button>`).join('');
 return `<div class="tp"><h4>View angle</h4><div class="mb">${ch(TGV)}</div><h4>CAD / production</h4><div class="mb">${ch(TGC)}</div><h4>Custom tag</h4><div class="mb">${ch(cu)}<input id="ctag" placeholder="e.g. Client markup" maxlength="40"><button type="button" data-a="ct">Add</button></div></div>`}
function mediaUI(){const el=$('#mlist');if(!el)return;
 el.innerHTML=WM.map((m,n)=>`<div class="mr" data-i="${n}"><div class="th">${!m.url?'':m.kind==='video'?`<video src="${m.url}#t=0.1" muted preload="metadata"></video>`:`<img src="${m.url}" alt="">`}${n===0?'<b>Cover</b>':''}</div><div class="mi"><div class="mtags">${m.tags.map(x=>`<span>${esc(x)}</span>`).join('')||'<small class="mute">No tags</small>'}</div><div class="mb">${n?'<button type="button" data-a="cov">Set cover</button>':''}<button type="button" data-a="l"${n?'':' disabled'} aria-label="Move earlier">‹</button><button type="button" data-a="r"${n<WM.length-1?'':' disabled'} aria-label="Move later">›</button><button type="button" data-a="tg" class="${WO===m.id?'on':''}">${WO===m.id?'Done':'Tags'}</button><button type="button" class="d" data-a="rm">Remove</button></div></div>${WO===m.id?tagPanel(m):''}</div>`).join('')}
async function form(type,id){
 const t=T[type],it=id?D.items.find(x=>x.id===id):{};await ensureUrls(it.media);
 WM=(it.media||[]).map(m=>({...m,tags:[...(m.tags||[])],url:MU[m.id]||''}));WO='';
 const fl=it.scrapped?[...t.f.slice(0,-1),['scrapReason','Scrap reason','pick',SRN],t.f[t.f.length-1]]:t.f;
 $('#dlg').innerHTML=`<div class="fh"><h2>${id?'Edit':'Add'} ${id?t.one:'to '+t.label}</h2></div><div class="fb">`+fl.map(([k,l,ty,x,r])=>{
  const v=it[k]??(k==='wt'?it.spec:null)??(k==='date'||k==='start'?today():'');let c;
  if(ty==='media')c=`<label class="up" for="f_media" style="min-height:110px">${ic('plus')}<span>Add photos &amp; videos</span><small>Select several at once. The first item is the cover.</small></label><input type="file" id="f_media" accept="image/*,video/*" multiple hidden><div id="mlist" style="margin-top:10px"></div>`;
  else if(ty==='select')c=`<select id="f_${k}">${x.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`;
  else if(ty==='pick'){const xs=k==='size'?sizeFor(it.cat||CATS[0]):x;c=`<select id="f_${k}" data-pick="1">${pickOpts(xs,v)}</select><input id="o_${k}" value="${v&&!xs.includes(v)?esc(v):''}" placeholder="Type it here" style="margin-top:6px"${v&&!xs.includes(v)?'':' hidden'}>`}
  else if(ty==='textarea')c=`<textarea id="f_${k}" style="min-height:140px" placeholder="${esc(x||'')}">${esc(v)}</textarea>`;
  else c=`<input type="${ty}" id="f_${k}" value="${esc(v)}" placeholder="${esc(x||'')}"${ty==='number'?' min="1" inputmode="numeric"':''}>`;
  return `<div class="f"><label for="f_${k}">${l}${r?' *':''}</label>${c}</div>`}).join('')+
 `<div class="row"><button class="btn o" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div></div>`;
 mediaUI();
 $('#f_media').onchange=e=>{[...e.target.files].forEach(f=>{const v=f.type.startsWith('video');if(!v&&!f.type.startsWith('image'))return;WM.push({id:uid(),kind:v?'video':'image',name:f.name,tags:[],file:f,url:URL.createObjectURL(f)})});e.target.value='';mediaUI()};
 $('#mlist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=b.closest('.mr');if(!r)return;const n=+r.dataset.i,m=WM[n];if(!m)return;
  if(b.dataset.tg){const x=b.dataset.tg,k=m.tags.indexOf(x);if(k<0)m.tags.push(x);else m.tags.splice(k,1)}
  else switch(b.dataset.a){
   case'cov':WM.unshift(WM.splice(n,1)[0]);break;
   case'l':if(n>0)[WM[n-1],WM[n]]=[WM[n],WM[n-1]];break;
   case'r':if(n<WM.length-1)[WM[n+1],WM[n]]=[WM[n],WM[n+1]];break;
   case'tg':WO=WO===m.id?'':m.id;break;
   case'rm':WM.splice(n,1);if(WO===m.id)WO='';break;
   case'ct':{const v=$('#ctag').value.trim();if(v&&!m.tags.includes(v))m.tags.push(v);break}
   default:return}
  mediaUI();if(b.dataset.a==='ct'&&$('#ctag'))$('#ctag').focus()};
 $('#mlist').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ctag'){e.preventDefault();e.target.closest('.tp').querySelector('[data-a=ct]').click()}};
 const cs=$('#f_cat'),ss=$('#f_size');if(cs&&ss)cs.onchange=()=>{ss.innerHTML=pickOpts(sizeFor(cs.value),'');$('#o_size').value='';$('#o_size').hidden=true};
 document.querySelectorAll('select[data-pick]').forEach(sl=>sl.onchange=()=>{const o=$('#o_'+sl.id.slice(2));o.hidden=sl.value!=='__o';if(!o.hidden)o.focus()});
 $('#cx').onclick=()=>$('#dlg').close();
 $('#sv').onclick=async()=>{
  const o=Object.assign({ts:Date.now()},it,{id:it.id||uid(),type});
  for(const [k,l,ty,x,r] of fl){if(ty==='media')continue;const el=$('#f_'+k);
   if(ty==='pick')o[k]=el.value==='__o'?$('#o_'+k).value.trim():el.value;else{o[k]=el.value.trim();if(r&&!o[k]){el.focus();el.style.borderColor='var(--bad)';return}}}
  o.uid=(o.uid||'').toUpperCase();delete o.notes;delete o.img;
  try{for(const m of WM)if(m.file)await mput(m.id,m.file)}catch(e){toast('Could not store a file. Browser storage may be full.');return}
  const keep=new Set(WM.map(m=>m.id));for(const m of it.media||[])if(!keep.has(m.id)){await mdel(m.id);delete MU[m.id]}
  WM.forEach(m=>{if(m.file)MU[m.id]=m.url});
  o.media=WM.map(m=>({id:m.id,kind:m.kind,name:m.name,tags:m.tags}));
  if(o.status==='Completed'&&type==='practice'&&!o.end)o.end=today();if(!id)D.items.push(o);else D.items=D.items.map(x=>x.id===id?o:x);
  save();if(!o.scrapped)tab=type;q='';cf='';rf='';fs=o.status||'Still working';$('#q').value='';render();$('#dlg').close();if($('#page').classList.contains('on'))detail(o.id);toast(id?'Saved':'Added to '+t.label);
 };
 if(!$('#dlg').open)$('#dlg').showModal();$('#dlg').scrollTop=0;
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
function settings(){
 $('#dlg').innerHTML=`<div class="fh"><h2>Backup</h2></div><div class="fb"><p class="mute" style="color:var(--mute)">Your studio is saved in this browser. Download a backup to keep it safe or move it to another device.</p>
 <div class="row"><button class="btn" id="ex">Download backup</button><button class="btn o" id="im">Restore</button></div><div class="row"><button class="btn o" id="exs">Show examples</button><button class="btn o" id="exr">Remove examples</button></div><div class="shr" id="shr1"><h3>Share catalogue (view only)</h3><p id="shtxt"></p><input id="shlink" readonly hidden><div class="row" id="shrow"></div><div class="row"><button class="btn o" id="gh">Export for GitHub (catalogue.json)</button></div></div>
 <div class="shr" id="ghbox"><h3>Share from GitHub (no Claude needed)</h3><p id="ghtxt"></p><div id="ghf"></div><div class="row"><button class="btn o" id="gh2">Download catalogue.json instead</button></div></div>
 <div class="row"><button class="btn o" id="cx">Close</button></div>
 <input type="file" id="imf" accept="application/json" hidden></div>`;
 $('#cx').onclick=()=>$('#dlg').close();
 shareUI();$('#gh').onclick=exportCat;$('#gh2').onclick=exportCat;const hc=!!(window.claude&&claude.use);$('#shr1').hidden=!hc;$('#ghbox').hidden=hc;ghUI();
 $('#exs').onclick=()=>{seed();render();$('#dlg').close();toast('Examples added')};
 $('#exr').onclick=()=>{D.items=D.items.filter(i=>!i.ex);save();render();$('#dlg').close();toast('Examples removed')};
 $('#ex').onclick=async()=>{toast('Preparing backup…');saveFile('cad-studio-backup.json',JSON.stringify(await backupData()))};
 $('#im').onclick=()=>$('#imf').click();
 $('#imf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(async s=>{try{const j=JSON.parse(s);if(!Array.isArray(j.items))throw 0;if(confirm('Replace everything with this backup?')){try{await idbClear('m')}catch(x){}for(const i of j.items)for(const m of i.media||[]){if(m.data){await mput(m.id,d2b(m.data));delete m.data}}Object.keys(MU).forEach(k=>delete MU[k]);D=j;D.mv=0;await migrate();render();$('#dlg').close()}}catch(x){toast('That is not a valid backup file')}})};
 $('#dlg').showModal();
}
function menu(on){$('#menu').classList.toggle('on',on);$('#scrim').classList.toggle('on',on);$('#fab').classList.toggle('on',on);$('#fab').setAttribute('aria-expanded',on)}

$('#fab').innerHTML=ic('plus');$('#gear').innerHTML=ic('dots');
$('#menu').innerHTML=['catalogue','reference','practice'].map(t=>`<button data-a="${t}">Add to ${T[t].label}<i>${ic(t)}</i></button>`).join('');
$('#fab').onclick=()=>menu(!$('#menu').classList.contains('on'));
$('#scrim').onclick=()=>menu(false);
$('#menu').onclick=e=>{const b=e.target.closest('[data-a]');if(b){menu(false);form(b.dataset.a)}};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;q='';cf='';rf='';fs='Still working';$('#q').value='';render();scrollTo(0,0)}};
$('#grid').onclick=e=>{if(e.target.closest('[data-ex]')){seed();render();toast('Examples added. Remove them anytime from the ⋯ menu');return}const b=e.target.closest('[data-id]');if(b){SP='spec';detail(b.dataset.id)}};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#fchips').onclick=e=>{const r=e.target.closest('[data-r]');if(r){rf=r.dataset.r;render();return}const b=e.target.closest('[data-f]');if(b){fs=b.dataset.f;render()}};
$('#catb').onclick=catSheet;$('#so').onchange=e=>{so=e.target.value;render()};
$('#gear').onclick=settings;
$('#dlg').onclick=e=>{if(e.target===$('#dlg'))$('#dlg').close()};
(async()=>{await load();if((D.v||0)<3){D.items=D.items.filter(i=>!i.ex);D.v=3;save()}
if((D.mv||0)<2)await migrate();D.items.forEach(i=>{if(i.type==='practice'&&!i.start&&i.date)i.start=i.date;if(!i.status&&i.type==='reference')i.status='In idea';if(!i.status&&i.type==='practice')i.status='Completed';const mk=(i.metal||'').toLowerCase();if(MM[mk])i.metal=MM[mk];const sm=/^US ([\d.]+)$/.exec(i.size||''),sr=sm&&RS.find(x=>x[2]===sm[1]);if(sr)i.size=`US ${sr[2]} (${sr[0]} mm)`;if((i.stones||'').toLowerCase()==='cubic zirconia')i.stones='CZ'});addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#zoom').classList.contains('on'))closeZoom();else if(!$('#dlg').open)closePage()}});
if(VIEW)startView();else{render();if(window.claude&&claude.use)claude.use('user').then(async u=>{if(u&&(await u.isOwner())===false)startView()}).catch(()=>{});if(D.share)schedSync()}
})();
</script>
